<div class="container col-12">
    <div class="row">
        <div class="col-12">
            <table class="table table-bordered table-light table-hover table-sm font form-text table text-center">
            <thead>
            <tr>
                <th scope="col-1">#</th>
                <th scope="col-2">Nome:</th>
                <th scope="col-3">Idade:</th>
                <th scope="col-4">Email:</th>
                <th scope="col-5">Cargo:</th>
                <th scope="col-5">Editar:</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let cadastro of cadastros; let i = index">
                <td scope="row-1">{{ i + 1 }}</td>
                <td scope="row-2">{{cadastro.nome}}</td>
                <td scope="row-3">{{cadastro.idade}}</td>
                <td scope="row-4">{{cadastro.email}}</td>
                <td scope="row-5">{{cadastro.cargo}}</td>
                <td scope="row-6">
                    <button class="btn btn-warning" (click)="editar(i)">Editar</button>
                </td>
            </tr>
            </tbody>
            </table>
        </div>
    </div>
</div>
