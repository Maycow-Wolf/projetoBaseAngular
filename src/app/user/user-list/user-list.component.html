<div class="container col-12">
    <div class="row">
        <div class="col-12">
            <table class="table table-bordered table-light table-hover table-sm font form-text table text-center">
            <thead>
            <tr>
                <th scope="col-1">#</th>
                <th scope="col-2">Nome:</th>
                <th scope="col-3">Idade:</th>
                <th scope="col-4">Email:</th>
                <th scope="col-5">Cargo:</th>
                <th scope="col-5">Editar</th>
                <th scope="col-6">Excluir</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let item of cadastros; let i = index">
                <td scope="row-1">{{item.id}}</td>
                <td scope="row-2">{{item.name}}</td>
                <td scope="row-3">{{item.idade}}</td>
                <td scope="row-4">{{item.email}}</td>
                <td scope="row-5">{{item.cargo}}</td>
                <td scope="row-6">
                    <button class="btn btn-warning" (click)="editar(item.id)">Editar</button>
                </td>
                <td scope="row-7">
                <button class="btn btn-danger" (click)="excluir(item.id)">Excluir</button>
                </td>

            </tr>
            </tbody>
            </table>
        </div>
    </div>
</div>
