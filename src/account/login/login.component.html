<div *ngIf="mensagem"  class=" mensagem font form-text">
    {{ mensagem }}
</div>
<form [formGroup]="meuLogin" (ngSubmit)="acessarUsuarios()">
    <div class="container col-12">
        <h3 class="text-center text text-black font form-text-size">Faça seu Login</h3>
		<br>
        <div class="row justify-content-center">
			<div class="col-3">
				<input type="text" formControlName="email" placeholder="Digite o email" 
                class="form-control" required (focus)="limparMensagem()"/>
				<div class="text-danger font form-text">
					<span *ngIf="meuLogin.controls.email.errors?.['required'] && meuLogin.controls.email.touched">
                        Campo email obrigatório.
                    </span>
					<span *ngIf="meuLogin.controls.email.errors?.['email']">
						Email inválido.
					</span>
				</div>
			</div>
        </div>    
        <br>
        <div class="row justify-content-center">
            <div class="col-3">
                <div class="input-group">
                    <input [type]="mostrarSenha ? 'text' : 'password'" 
                    formControlName="senha" placeholder="Digite a senha" 
                    class="form-control input-senha" required (focus)="limparMensagem()"/>
                    <i class = 'fa icone-senha' (click)="alternarVisibilidadeSenha()"  
                    [ngClass]="mostrarSenha ? 'fa fa-eye-slash' : 'fa fa-eye'">
                    </i>
                </div>
                <div class="text-danger font form-text">
                    <span *ngIf="meuLogin.controls.senha.errors?.['required'] && meuLogin.controls.senha.touched">
                        Campo senha obrigatório.
                    </span>
                    <span *ngIf="meuLogin.controls.senha.errors?.['minlength'] && meuLogin.controls.senha.touched">
                        Mínimo 6 dígitos.
                    </span>
                    <span *ngIf="meuLogin.controls.senha.errors?.['maxlength'] && meuLogin.controls.senha.touched">
                        Máximo 10 dígitos.
                    </span>
                </div>
            </div>
        </div>    
        <br>
        <div class="row justify-content-center">
            <div class="col-1">
                <button [disabled]="!meuLogin.valid" class="btn btn-outline-secondary" type="submit">
                    Login
                </button>
            </div>
        </div>
        <br>
        <div class="row justify-content-center">
            <div class="col-3">
                <p>Não tem cadastro? <a href="javascript:void(0)" (click)="acessarCadastro()" class="link-opacity-50-hover">Registre-se</a></p>
            </div>
        </div>
    </div>    
</form>
